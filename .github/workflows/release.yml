name: Release

# Push a tag like v1.0.0 and this builds PowerFlow.zip and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 PowerFlow.zip | cut -d' ' -f1 > PowerFlow.zip.sha256
          gh release create "$GITHUB_REF_NAME" PowerFlow.zip PowerFlow.zip.sha256 --title "PowerFlow $GITHUB_REF_NAME" --generate-notes
